<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Panel</title>
<style>
:root{--bg:#f6f5f2;--kart:#ffffff;--yazi:#1d1d1b;--soluk:#6b6a65;--cizgi:#e3e1db;--vurgu:#b8860b;--al:#1f8a4c;--sat:#c0392b;--bant:rgba(184,134,11,.13);--ma:#8a6d1f;--gumus:#7b8794}
@media (prefers-color-scheme: dark){:root{--bg:#121212;--kart:#1d1d1d;--yazi:#ecebe6;--soluk:#a09f99;--cizgi:#333230;--vurgu:#e0b84a;--al:#3ecf7a;--sat:#ff6b5b;--bant:rgba(224,184,74,.16);--ma:#d9b860;--gumus:#aab4bf}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:16px}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px 16px;margin:0 0 14px}
h1{font-size:1.25rem;margin:4px 0 12px}h2{font-size:1.08rem;margin:0 0 8px}h3{font-size:.98rem;margin:12px 0 6px}
.soluk{color:var(--soluk);font-size:.88rem}
.izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 14px}
.izgara div b{display:block;font-size:1.02rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--cizgi);vertical-align:top}
th{color:var(--soluk);font-weight:600}
.tablo{overflow-x:auto;-webkit-overflow-scrolling:touch}
.al{color:var(--al);font-weight:600}.sat{color:var(--sat);font-weight:600}
.rozet{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid currentColor}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--soluk);font-size:10px}
.c-fiyat{stroke:var(--yazi);fill:none;stroke-width:1.6}.c-ma{stroke:var(--ma);fill:none;stroke-width:1.3;stroke-dasharray:4 3}
.c-bant{fill:var(--bant);stroke:none}.c-al{fill:var(--al)}.c-sat{fill:var(--sat)}.c-ekseni{stroke:var(--cizgi)}
.c-altin{stroke:var(--vurgu);fill:none;stroke-width:1.6}.c-gumus{stroke:var(--gumus);fill:none;stroke-width:1.6}
form{display:flex;flex-direction:column;gap:10px}
input[type=password]{font-size:1rem;padding:12px;border-radius:10px;border:1px solid var(--cizgi);background:var(--bg);color:var(--yazi);width:100%}
button{font-size:1rem;padding:12px;border-radius:10px;border:0;background:var(--vurgu);color:#111;font-weight:600}
button.ikincil{background:transparent;color:var(--soluk);border:1px solid var(--cizgi);padding:8px 12px;font-size:.9rem}
label{font-size:.92rem;display:flex;gap:8px;align-items:center}
#hata{color:var(--sat);min-height:1.4em;margin:0}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<section id="giris" class="kart">
<h1>🔒 Panel</h1>
<form id="form" autocomplete="off">
<input id="sifre" type="password" placeholder="Şifre" autocomplete="current-password" required>
<label><input id="hatirla" type="checkbox"> Bu cihazda hatırla</label>
<button type="submit">Aç</button>
<p id="hata" role="alert"></p>
</form>
</section>
<div id="icerik" hidden></div>

<script>
(function(){
"use strict";
var ANAHTAR="panel_anahtar_v1";
var P=JSON.parse(document.getElementById("veri").textContent);
function b2a(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function a2b(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function oku(){try{return JSON.parse(localStorage.getItem(ANAHTAR)||"null");}catch(e){return null;}}
function yaz(v){try{localStorage.setItem(ANAHTAR,JSON.stringify(v));}catch(e){}}
function sil(){try{localStorage.removeItem(ANAHTAR);}catch(e){}}
function turet(sifre,cikarilabilir){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(sifre),"PBKDF2",false,["deriveKey"]).then(function(t){
    return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b2a(P.salt),iterations:P.tur},t,{name:"AES-GCM",length:256},cikarilabilir,["decrypt"]);
  });
}
function coz(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(P.iv)},k,b2a(P.ct)).then(function(d){return new TextDecoder().decode(d);});}
function goster(h){
  document.getElementById("giris").hidden=true;
  var ic=document.getElementById("icerik");ic.innerHTML=h;ic.hidden=false;
  var c=document.getElementById("cikis");
  if(c)c.addEventListener("click",function(){sil();location.reload();});
}
function hata(m){document.getElementById("hata").textContent=m;}
var kayitli=oku();
if(kayitli&&kayitli.salt===P.salt&&kayitli.k){
  crypto.subtle.importKey("raw",b2a(kayitli.k),{name:"AES-GCM"},false,["decrypt"]).then(coz).then(goster).catch(function(){sil();});
}else if(kayitli){sil();}
document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault();hata("Açılıyor…");
  var s=document.getElementById("sifre").value,h=document.getElementById("hatirla").checked;
  turet(s,h).then(function(k){
    return coz(k).then(function(metin){
      if(h){return crypto.subtle.exportKey("raw",k).then(function(r){yaz({salt:P.salt,k:a2b(r)});return metin;});}
      return metin;
    });
  }).then(function(m){document.getElementById("sifre").value="";goster(m);})
  .catch(function(){hata("Şifre yanlış.");});
});
})();
</script>
